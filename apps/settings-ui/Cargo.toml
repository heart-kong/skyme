[package]
name = "skyme-settings-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
skyme-common = { path = "../../crates/common" }
skyme-settings = { path = "../../crates/settings" }
skyme-config = { path = "../../crates/config" }
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
] }
